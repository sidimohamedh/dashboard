<aside class="sidebar" [class.open]="toggleMenu">
  <div class="sidebar__logo">
    <img class="material-icons" src="assets/icons/graph.svg" alt="logo" (click)="toggle()">
    <span>Dashboard</span>
  </div>

  <nav class="sidebar__menu">
    <a routerLink="/main/dashboard"
       routerLinkActive="active"
       class="sidebar__link">
       <img class="material-icons" src="assets/icons/dashboard.svg" alt="">
       <span>Dashboard</span>
    </a>

    <a routerLink="/main/applications"
    routerLinkActive="active"
    class="sidebar__link">
      <img class="material-icons" src="assets/icons/applications.svg" alt="">
      <span>Applications</span>
    </a>
    
    <a routerLink="/main/users"
    routerLinkActive="active"
    class="sidebar__link">
      <img class="material-icons" src="assets/icons/users.svg" alt="">
      <span>Users</span>
    </a>
    
    <a routerLink="/main/time-invested"
    routerLinkActive="active"
    class="sidebar__link">
      <img class="material-icons" src="assets/icons/hourglass-empty.svg" alt="">
      <span>Time invested</span>
    </a>
  </nav>
</aside>
